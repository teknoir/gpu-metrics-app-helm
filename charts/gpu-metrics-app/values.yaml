# configurable values for the gpu-metrics-app Helm chart

defaults:
  annotations:
    teknoir.org/managed-by: devstudio
  resources:
    limits:
      cpu: 1000m
      memory: 1048Mi
    requests:
      cpu: 100m
      memory: 128Mi
  image:
    repository: ghcr.io/teknoir/gpu-metrics-app
    tag: latest

dcgm-exporter:
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9400"
    teknoir.org/managed-by: devstudio
  service:
    annotations:
      teknoir.org/managed-by: devstudio
  serviceAccount:
    annotations:
      teknoir.org/managed-by: devstudio
  nameOverride: "nvidia-exporter"
  namespaceOverride: "default"
  runtimeClassName: "nvidia"
  serviceMonitor:
    enabled: false

gpu:
  nvidia: true

